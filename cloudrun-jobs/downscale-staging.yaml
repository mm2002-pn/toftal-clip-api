# Cloud Run Job — on-demand downscale worker (staging)
# =====================================================
# Triggered programmatically by the API (downscaleJobsService) every
# time a user clicks Download on a quality that doesn't exist yet. One
# execution per (versionId, quality) pair; concurrency is enforced by
# the UNIQUE(version_id, quality) constraint on version_downscale_jobs.
#
# Deploy once (and again whenever this file changes):
#   gcloud run jobs replace cloudrun-jobs/downscale-staging.yaml \
#     --region=europe-west1
#
# The API SA needs roles/run.invoker on this job — one-time setup:
#   gcloud run jobs add-iam-policy-binding toftal-downscale-staging \
#     --region=europe-west1 \
#     --member='serviceAccount:<api-sa>@toftal-clip-api.iam.gserviceaccount.com' \
#     --role='roles/run.invoker'
#
# Manual smoke test (replace ids):
#   gcloud run jobs execute toftal-downscale-staging \
#     --region=europe-west1 \
#     --update-env-vars=VERSION_ID=<uuid>,QUALITY=720p,JOB_ROW_ID=<uuid>

apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: toftal-downscale-staging
  labels:
    env: staging
    purpose: downscale
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          # 1h ceiling. The ffmpeg call inside has a 50-min internal
          # timeout so we surface a clean error rather than a SIGKILL.
          timeoutSeconds: 3600
          # The whole point of this Job is to retry on its own when the
          # API caller triggers a retry — we don't want Cloud Run to
          # silently re-run a corrupt-input downscale 3 times in a row.
          maxRetries: 0
          containers:
            - image: gcr.io/toftal-clip-api/toftal-clip-api-staging:staging-latest
              command:
                - npm
              args:
                - run
                - downscale:run
              env:
                - name: NODE_ENV
                  value: staging
                - name: GCS_BUCKET_NAME
                  value: toftal-clip-media
                - name: GCP_PROJECT_ID
                  value: toftal-clip-api
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: DATABASE_URL_STAGING
                      key: latest
              resources:
                limits:
                  # ffmpeg is CPU-bound. 2 vCPU + 2 GiB is the sweet
                  # spot for 1080p→720p at preset=veryfast. Bump if we
                  # start downscaling 4K+ sources to higher targets.
                  cpu: "2"
                  memory: "2Gi"
          volumes: []
          serviceAccountName: backfill-job-sa@toftal-clip-api.iam.gserviceaccount.com
