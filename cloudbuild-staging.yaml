# Cloud Build configuration for deploying to Cloud Run (STAGING)
# Triggered automatically on push to staging branch

substitutions:
  _SERVICE_NAME: toftal-clip-api-staging
  _REGION: europe-west1
  _INSTANCE_CONNECTION_NAME: ${PROJECT_ID}:${_REGION}:toftal-clip-db
  _DB_NAME: toftal_staging_studio_db

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

  # Run database migrations using Cloud SQL Proxy
  - name: 'node:20'
    id: 'run-migrations'
    entrypoint: bash
    args:
      - '-c'
      - |
        # Download Cloud SQL Proxy
        curl -o /tmp/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.8.0/cloud-sql-proxy.linux.amd64
        chmod +x /tmp/cloud-sql-proxy

        # Start proxy in background
        /tmp/cloud-sql-proxy --port=5432 ${_INSTANCE_CONNECTION_NAME} &
        PROXY_PID=$$!

        # Wait for proxy to be ready
        sleep 5

        # Set DATABASE_URL for Prisma (STAGING database)
        export DATABASE_URL="postgresql://toftal_user:$${DB_PASSWORD}@127.0.0.1:5432/${_DB_NAME}?schema=public"

        # Install dependencies and run migrations
        npm ci
        npx prisma generate
        npx prisma db push --accept-data-loss

        # Kill proxy
        kill $$PROXY_PID || true
    secretEnv: ['DB_PASSWORD']

  # Deploy to Cloud Run (STAGING)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${_INSTANCE_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'TRUST_PROXY=true,CORS_ORIGIN=https://toftalclip.io;https://staging.toftalclip.io;https://toftal-clip.netlify.app;https://toftal-clip-test.netlify.app,NODE_ENV=staging,FRONTEND_URL=https://staging.toftalclip.io,EMAIL_SERVICE=gmail,EMAIL_USER=toftalpodium@gmail.com,EMAIL_FROM=Toftal Clip toftalpodium@gmail.com,RATE_LIMIT_MAX=1000,DB_CONNECTION_LIMIT=10,DB_POOL_TIMEOUT=30,GCS_BUCKET_NAME=toftal-clip-media,GCP_PROJECT_ID=toftal-clip-api,GCP_REGION=${_REGION},UPSTASH_REDIS_REST_URL=https://mint-polecat-37123.upstash.io,BICTORYS_API_URL=https://api.test.bictorys.com,MEDIA_PUBLIC_BASE_URL=https://media.staging.toftalclip.io/,FASTSTART_JOB_NAME=faststart-worker-staging,HLS_JOB_NAME=hls-worker-staging'
      # Secrets — Bictorys keys live in Secret Manager so they survive
      # `--set-secrets` re-applications (gcloud replaces, not merges, so
      # any manually-added var gets wiped on the next deploy unless
      # listed here). See `availableSecrets` below for creation refs.
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL_STAGING:latest,JWT_SECRET=JWT_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,EMAIL_PASSWORD=EMAIL_PASSWORD:latest,GROQ_API_KEY=GROQ_API_KEY:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,REDIS_TCP_URL=REDIS_TCP_URL:latest,BICTORYS_PUBLIC_KEY=BICTORYS_PUBLIC_KEY_STAGING:latest,BICTORYS_SECRET_KEY=BICTORYS_SECRET_KEY_STAGING:latest,BICTORYS_WEBHOOK_SECRET=BICTORYS_WEBHOOK_SECRET_STAGING:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET_STAGING:latest'
      - '--min-instances'
      - '2'
      - '--max-instances'
      - '20'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '3600'
      - '--session-affinity'

  # Deploy faststart-worker as a Cloud Run Job (STAGING).
  # Reuses the same image as the API but overrides the entrypoint to run
  # the worker. gen2 execution environment is required for the SSD-backed
  # scratch space — large video downloads (5–20 GB on long formats) would
  # OOM gen1's RAM-backed /tmp.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'faststart-worker-staging'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--set-cloudsql-instances'
      - '${_INSTANCE_CONNECTION_NAME}'
      - '--command'
      - 'node'
      - '--args'
      - 'dist/workers/faststart.js'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--max-retries'
      - '2'
      - '--task-timeout'
      - '1800s'
      - '--execution-environment'
      - 'gen2'
      - '--set-env-vars'
      - 'NODE_ENV=staging,GCS_BUCKET_NAME=toftal-clip-media,GCP_PROJECT_ID=toftal-clip-api,GCP_REGION=${_REGION},MEDIA_PUBLIC_BASE_URL=https://media.staging.toftalclip.io/,UPSTASH_REDIS_REST_URL=https://mint-polecat-37123.upstash.io,INTERNAL_API_BASE_URL=https://api.staging.toftalclip.io'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL_STAGING:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,REDIS_TCP_URL=REDIS_TCP_URL:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET_STAGING:latest'

  # Deploy hls-worker as a Cloud Run Job (STAGING) — Phase 2 ABR
  # encoding pipeline. Same image as the API/faststart, different
  # entry point (dist/workers/hls.js). Sized larger than faststart
  # because this is real x264 re-encode work, not just a remux.
  #
  # 4 vCPU and 8 GB RAM keep the libx264 threads fed; 120 min timeout
  # covers a 2h source at preset=fast (~30-60 min on 4 vCPU). gen2
  # for SSD scratch — large source + 4 variant outputs + thousands
  # of segment .ts files chew up disk, not RAM.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'hls-worker-staging'
      - '--image'
      - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--set-cloudsql-instances'
      - '${_INSTANCE_CONNECTION_NAME}'
      - '--command'
      - 'node'
      - '--args'
      - 'dist/workers/hls.js'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--max-retries'
      - '1'
      - '--task-timeout'
      - '7200s'
      - '--execution-environment'
      - 'gen2'
      - '--set-env-vars'
      - 'NODE_ENV=staging,GCS_BUCKET_NAME=toftal-clip-media,GCP_PROJECT_ID=toftal-clip-api,GCP_REGION=${_REGION},MEDIA_PUBLIC_BASE_URL=https://media.staging.toftalclip.io/,UPSTASH_REDIS_REST_URL=https://mint-polecat-37123.upstash.io,INTERNAL_API_BASE_URL=https://api.staging.toftalclip.io'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL_STAGING:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,REDIS_TCP_URL=REDIS_TCP_URL:latest,INTERNAL_API_SECRET=INTERNAL_API_SECRET_STAGING:latest'

images:
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - 'gcr.io/${PROJECT_ID}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/DB_PASSWORD/versions/latest
      env: 'DB_PASSWORD'
